apiVersion: config.kio.kasten.io/v1alpha1
kind: Profile
metadata:
  name: mhaigh-argocd-setup-gcp-location
  namespace: kasten-io
spec:
  locationSpec:
    credential:
      secret:
        apiVersion: v1
        kind: secret
        name: k10secret-gcp-sa-key
        namespace: kasten-io
      secretType: GcpServiceAccountKey
    objectStore:
      name: k10-argocd-setup-mhaigh
      objectStoreType: GCS
      region: us-central1
    type: ObjectStore
  type: Location

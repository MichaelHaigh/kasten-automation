apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-sa
  namespace: kasten-io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k10-admin-dashboard-sa
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k10-admin
subjects:
- kind: ServiceAccount
  name: dashboard-sa
  namespace: kasten-io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k10-ns-admin-dashboard-sa
  namespace: kasten-io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k10-ns-admin
subjects:
- kind: ServiceAccount
  name: dashboard-sa
  namespace: kasten-io
---
kind: Profile
apiVersion: config.kio.kasten.io/v1alpha1
metadata:
  name: default-gcp-profile
  namespace: kasten-io
spec:
  infra:
    credential:
      secretType: GcpServiceAccountKey
      secret:
        apiVersion: v1
        kind: secret
        name: k10secret-gcp-sa-key
        namespace: kasten-io
    type: GCP
  type: Infra

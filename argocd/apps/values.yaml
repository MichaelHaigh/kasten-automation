config:
  spec:
    destination:
      server: https://kubernetes.default.svc

applications:
  - name: pacman
    chart: pacman
    tool:
      helm:
        releaseName: pacman
        valuesObject:
          service:
            type: LoadBalancer
    source:
      repoURL: https://michaelhaigh.github.io/pacman/
      targetRevision: 0.1.23

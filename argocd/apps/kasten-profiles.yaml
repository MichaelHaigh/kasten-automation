apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: kasten-profiles
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: kasten-io
    server: https://kubernetes.default.svc
  project: default
  sources:
    repoURL: https://github.com/MichaelHaigh/kasten-automation.git
    targetRevision: argocd-setup # change to main when merging to main
    path: argocd/addons/kasten
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
